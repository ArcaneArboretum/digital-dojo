name: StrictDoc generation

# Runs only when documentation-related files change as part of a pull request or push to main.
on:
  pull_request:
    branches: [main]  # matches the PR's target (base) branch
    paths:
      - "docs/**"
      - "strictdoc_config.py"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "strictdoc_config.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR/branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  strictdoc-build:
    name: strictdoc-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install StrictDoc
        run: pip install -r docs/requirements.txt

      # Fails the job if any .sdoc file is invalid or has broken references,
      # so this doubles as a validation check for the requirements docs.
      - name: Build Requirements Documentation
        run: strictdoc export . --output-dir output

      # For PRs only
      - name: Upload Preview Artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
            name: strictdoc-html
            path: output/html
            retention-days: 14
      
      # For Pushes to Main / Manual Runs
      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/html

  # Deploy the Generated Docs to GitHub Pages for the Repo On Manual Run / Push to Main
  deploy-pages:
    name: deploy-strictdoc-to-pages
    needs: strictdoc-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
